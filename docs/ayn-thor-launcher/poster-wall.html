<title>Poster Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Bungee&family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;600;700&family=Manrope:wght@400;600;800&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: a single dark page built around one black AYN Thor; accent picker above, short notes below.
   Deliberately dark-only: these setups exist to keep OLED pixels off, so the page commits to that look. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#050506; --surface:#0f1013; --fg:#ecedf1; --muted:#8c909a; --line:#22242a;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --acc:#ff2a45; --acc-hi:#ff8a9b; --acc-lo:#4a0410;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.masthead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px 40px;align-items:end;margin-bottom:22px}
@media (max-width:820px){.masthead{grid-template-columns:minmax(0,1fr)}}
.eyebrow-l{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.masthead h1{font-size:clamp(36px,5.4vw,58px);font-weight:800;letter-spacing:-.035em;line-height:.95;margin-top:8px}
.masthead h1 em{font-style:normal;color:var(--acc)}
.masthead p{margin:0;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:26px}
.controls .lab{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:#000;color:var(--fg);cursor:pointer}
.swatches button i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 10px currentColor}
.swatches button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.swatches button:focus-visible,.plain:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-left:auto}
kbd{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:#000;color:var(--fg)}
.hintline{font-size:14px;color:var(--muted);text-align:center;margin:14px 0 0}
.hintline b{color:var(--fg)}
.notes{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 28px}
.notes div{padding:14px 0;border-top:1px solid var(--line)}
.notes h3{font-size:17px;font-weight:800}
.notes p{margin:4px 0 0;font-size:15px;color:var(--muted)}

/* ───────── Black AYN Thor, stick LEDs follow the accent ───────── */
.thor{--shell:#1d1e22;--shell-hi:#27282d;--shell-lo:#0f1012;--bezel:#060607;--btn:#2c2d32;--bink:#9da0a8;
  container-type:inline-size;width:100%;max-width:900px;margin-inline:auto;outline:none;user-select:none;-webkit-user-select:none;position:relative}
.thor:focus-visible .lid{box-shadow:0 0 0 3px var(--acc),0 1cqw 3cqw rgba(0,0,0,.5)}
.lid{background:linear-gradient(180deg,var(--shell-hi),var(--shell));border-radius:4cqw 4cqw 1.4cqw 1.4cqw;padding:2.4cqw 3cqw 2.8cqw;box-shadow:inset 0 .15cqw 0 rgba(255,255,255,.05),inset 0 -.4cqw 0 var(--shell-lo),0 1cqw 3cqw rgba(0,0,0,.5)}
.bezel{background:var(--bezel);border-radius:1.8cqw;padding:1.1cqw}
.hingerow{display:grid;grid-template-columns:13cqw 1fr 13cqw;gap:2cqw;align-items:start;padding-inline:3cqw}
.hinge{height:3.4cqw;background:linear-gradient(var(--shell-lo),var(--shell));border-radius:0 0 1.2cqw 1.2cqw}
.shoulder{height:2.2cqw;margin-top:.6cqw;border:0;border-radius:1.2cqw;background:var(--shell-lo);color:#5d6067;font:800 1.3cqw/1 var(--display);cursor:pointer;padding:0}
.shoulder:active,.fb:active,.dp:active{filter:brightness(1.5)}
.base{position:relative;background:linear-gradient(180deg,var(--shell),var(--shell-hi) 35%,var(--shell));border-radius:1.4cqw 1.4cqw 6cqw 6cqw;display:grid;grid-template-columns:1fr 46cqw 1fr;align-items:center;padding:3.6cqw 0 5cqw;box-shadow:inset 0 .3cqw 0 rgba(255,255,255,.04),0 1.4cqw 3cqw rgba(0,0,0,.5)}
.bottom-bezel{background:var(--bezel);border-radius:1.3cqw;padding:.9cqw}
.side{display:flex;flex-direction:column;align-items:center;gap:4.4cqw}
.stick{position:relative;width:12cqw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#121214 0 58%,#08080a 60% 70%,transparent 72%);display:grid;place-items:center}
.stick::before{content:"";position:absolute;inset:.9cqw;border-radius:50%;border:.38cqw solid var(--acc);box-shadow:0 0 1.8cqw .2cqw var(--acc),inset 0 0 1.2cqw var(--acc);transition:border-color .4s,box-shadow .4s}
.stick::after{content:"";position:relative;z-index:1;width:7cqw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a2b30,#121215 70%);box-shadow:0 .3cqw .6cqw rgba(0,0,0,.6)}
.dpad{width:13cqw;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);filter:drop-shadow(0 .4cqw 0 rgba(0,0,0,.4))}
.dp{border:0;padding:0;background:#151518;cursor:pointer;color:rgba(255,255,255,.2);font-size:1.6cqw}
.dp.u{grid-area:1/2;border-radius:.8cqw .8cqw 0 0}.dp.l{grid-area:2/1;border-radius:.8cqw 0 0 .8cqw}.dp.r{grid-area:2/3;border-radius:0 .8cqw .8cqw 0}.dp.d{grid-area:3/2;border-radius:0 0 .8cqw .8cqw}
.dpad .c{grid-area:2/2;background:#151518}
.abxy{width:15cqw;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.fb{width:4.6cqw;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;font:800 2.1cqw/1 var(--display);color:var(--bink);background:var(--btn);box-shadow:inset 0 -.35cqw 0 rgba(0,0,0,.4),0 .3cqw .6cqw rgba(0,0,0,.4);padding:0}
.fb.x{grid-area:1/2}.fb.y{grid-area:2/1}.fb.a{grid-area:2/3}.fb.b{grid-area:3/2}
.pill{position:absolute;bottom:2.4cqw;width:3cqw;aspect-ratio:1;border-radius:50%;background:var(--shell-lo);box-shadow:inset 0 .2cqw .3cqw rgba(0,0,0,.5)}
.pill.l{left:9cqw}.pill.r{right:9cqw}
.grille{position:absolute;bottom:2.9cqw;left:50%;transform:translateX(-50%);width:8cqw;height:1.4cqw;border-radius:1cqw;background:var(--shell-lo)}

/* ───────── Screens: shared ───────── */
.top-screen{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;overflow:clip;border-radius:.8cqw;background:#000;color:#f2f2f5;font-family:var(--ui)}
.wall{position:absolute;top:0;bottom:0;left:0;width:115%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.wall img{display:block;width:100%;height:100%;max-width:none;object-fit:cover}
.track{position:absolute;inset:0;display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.page{flex:0 0 100%;height:100%;position:relative}
.grid{position:absolute;z-index:1;left:var(--gl);right:var(--gl);top:var(--gt);bottom:var(--gb);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:var(--gap)}
.tile{position:relative;min-width:0;min-height:0;cursor:pointer;transition:transform .2s ease,filter .25s ease}
.clip{position:absolute;inset:0;overflow:hidden;border-radius:var(--r)}
.art,.scene{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.scene{image-rendering:pixelated}
.cap{position:absolute;left:.8cqw;bottom:.8cqw;font:700 .7cqw/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:.45cqw .7cqw;border-radius:.4cqw;background:rgba(0,0,0,.6);color:#fff}

/* poster art for games */
.poster{position:absolute;inset:0;color:#fff}
.pbg{position:absolute;inset:0;background:radial-gradient(circle at 60% 32%,color-mix(in srgb,var(--c2) 50%,transparent),transparent 58%),linear-gradient(170deg,var(--c1),color-mix(in srgb,var(--c1) 45%,#000))}
.psp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);height:48%;max-width:none;image-rendering:pixelated;filter:drop-shadow(0 .4cqw 0 rgba(0,0,0,.35))}
.poster.tall .psp{top:36%;height:auto;width:62%}
.poster.wide .psp{left:28%;top:48%;height:62%}
.pov{position:absolute;left:0;right:0;bottom:0;padding:2.4cqw .9cqw .8cqw;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.poster.wide .pov{left:auto;top:0;width:58%;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 35%)}
.pchip{font:700 .58cqw/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.plogo{font:800 1.05cqw/1.08 var(--logo);margin-top:.35cqw;text-wrap:balance;text-shadow:0 .15cqw .5cqw rgba(0,0,0,.6);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.poster.tall .plogo{font-size:1.25cqw}
.poster.wide .plogo,.poster.big .plogo{font-size:1.6cqw}
.chip{position:absolute;top:.9cqw;right:.9cqw;z-index:2;font:800 .66cqw/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:.45cqw .7cqw;border-radius:.45cqw;background:var(--acc);color:#fff}
.mini{position:relative;border-radius:.35cqw;overflow:hidden;background:radial-gradient(circle at 65% 35%,color-mix(in srgb,var(--c2) 40%,transparent),transparent 65%),var(--c1);display:grid;place-items:center;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.4)}
.mini img{width:58%;image-rendering:pixelated}

/* widgets (shared bones, styled per concept below) */
.clk{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 1.2cqw}
.clk-t{font:700 3cqw/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clk-d{font:500 .85cqw/1.2 var(--ui);opacity:.7;margin-top:.4cqw}
.nomedia{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;font:500 .85cqw var(--ui);color:#9a9aa3}
.nomedia svg{width:1.6cqw;height:1.6cqw}
.mus{position:absolute;inset:0;padding:1cqw;display:flex;gap:1cqw}
.mus-art{height:100%;aspect-ratio:1;flex:none;display:grid}
.mus-m{flex:1;min-width:0;display:flex;flex-direction:column}
.mus-l{font:700 .66cqw/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--acc-hi)}
.mus-t{font:700 1.1cqw/1.15 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.4cqw}
.mus-a{font-size:.76cqw;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-p{height:.3cqw;background:rgba(255,255,255,.12);border-radius:1cqw;margin-top:auto;overflow:hidden}
.mus-p i{display:block;height:100%;background:var(--acc)}
.mus-ctl{display:flex;gap:.55cqw;align-items:center;margin-top:.55cqw}
.mus-ctl button{width:1.9cqw;height:1.9cqw;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.mus-ctl button.play{background:var(--acc);width:2.3cqw;height:2.3cqw}
.mus-ctl svg{width:52%;height:52%}
.ptw{position:absolute;inset:0;padding:1cqw 1.2cqw .8cqw;display:flex;flex-direction:column}
.ptw-n{font:700 1.9cqw/1 var(--ui);color:var(--acc-hi);font-variant-numeric:tabular-nums}
.ptw-l{font:600 .85cqw/1.2 var(--ui);opacity:.85;margin-top:.2cqw}
.ptw-bars{flex:1;display:flex;align-items:flex-end;min-height:0;margin-top:.5cqw}
.ptw-bars i{flex:1;background:color-mix(in srgb,var(--acc) 55%,transparent);border-radius:.25cqw .25cqw 0 0;min-height:.15cqw}
.ptw-bars i.today{background:var(--acc)}
.ptw-days{display:flex;margin-top:.35cqw}
.ptw-days span{flex:1;text-align:center;font:600 .58cqw/1 var(--ui);opacity:.65}
.ptw-days span.today{color:var(--acc-hi);opacity:1}
.rec{position:absolute;inset:0;padding:1cqw 1.1cqw;display:flex;flex-direction:column;gap:.6cqw}
.rec-l{font:700 .66cqw/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.rec-row{flex:1;display:flex;gap:.8cqw;min-height:0}
.rec-row .mini{flex:1;min-width:0}
.rnd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;text-align:center;padding:.8cqw}
.rnd img{width:3.6cqw;image-rendering:pixelated;filter:drop-shadow(0 0 .8cqw var(--acc))}
.rnd-l{font:700 .9cqw/1.15 var(--ui)}
.rnd-s{font-size:.7cqw;opacity:.6}
.roll-chip{position:absolute;left:50%;bottom:.7cqw;transform:translateX(-50%);z-index:3;font:800 .66cqw/1 var(--ui);padding:.4cqw .7cqw;border-radius:2cqw;background:var(--acc);color:#fff;white-space:nowrap}
.aw{position:absolute;inset:0;padding:1cqw 1.1cqw;display:flex;flex-direction:column}
.aw-top{display:flex;justify-content:space-between;align-items:center;font:700 .7cqw/1 var(--ui);opacity:.8}
.aw-top svg{width:1.6cqw;height:1.6cqw;color:var(--acc-hi)}
.aw-big{font:700 2.6cqw/1 var(--ui);margin-top:auto}
.aw-s{font-size:.72cqw;opacity:.7}
.app{position:absolute;inset:0;background:var(--ac);color:var(--af);display:grid;place-items:center}
.app.pat{background:radial-gradient(circle,rgba(255,255,255,.07) 24%,transparent 26%) 0 0/2.6cqw 2.6cqw,var(--ac)}
.app svg{width:38%;max-width:5cqw;height:auto}
.app-n{position:absolute;left:.9cqw;bottom:.8cqw;font:700 .9cqw/1 var(--ui)}

/* overlays */
.ov{position:absolute;inset:0;z-index:8;pointer-events:none}
.ov>*{pointer-events:auto}
.fview{position:absolute;left:2cqw;right:2cqw;top:4.4cqw;bottom:4.4cqw;border-radius:1.2cqw;background:rgba(6,6,8,.94);border:.1cqw solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 3cqw color-mix(in srgb,var(--acc) 25%,transparent);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.fv-h{display:flex;align-items:end;gap:1.5cqw;padding:1.3cqw 1.6cqw 1cqw;border-bottom:.1cqw solid rgba(255,255,255,.08)}
.fv-k{font:700 .7cqw/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--acc-hi)}
.fv-t{font:800 2cqw/1 var(--logo);margin-top:.5cqw}
.fv-h code{font:600 .85cqw/1 var(--mono);padding:.45cqw .7cqw;border-radius:.5cqw;background:rgba(255,255,255,.06);color:#ddd}
.fv-h .n{margin-left:auto;font:700 .9cqw var(--ui);opacity:.6}
.fv-g{flex:1;overflow:auto;padding:1.3cqw 1.6cqw 1.6cqw;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1cqw;align-content:start}
.fv-i{position:relative;height:0;padding-bottom:133%;border-radius:.6cqw;overflow:hidden;cursor:pointer;filter:brightness(.6)}
.fv-i.focus{filter:none;outline:.3cqw solid var(--acc);outline-offset:.25cqw;box-shadow:0 0 1.6cqw var(--acc)}
.launch{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--acc) 22%,#000),#000 70%);color:#fff;display:grid;place-items:center;text-align:center;animation:pop .25s ease-out}
.launch .l-cv{position:relative;width:12cqw;aspect-ratio:3/4;border-radius:1cqw;overflow:hidden;margin:0 auto 1.6cqw;box-shadow:0 0 4cqw color-mix(in srgb,var(--acc) 50%,transparent)}
.launch .l-t{font:800 2.2cqw/1.1 var(--logo)}
.launch .l-s{font-size:1cqw;opacity:.7;margin-top:.5cqw}
.launch .l-bar{width:22cqw;height:.3cqw;border-radius:1cqw;background:rgba(255,255,255,.12);margin:1.3cqw auto 0;overflow:hidden}
.launch .l-bar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;animation:load 1.6s ease-in-out forwards}
@keyframes load{from{transform:scaleX(0)}}
.toast{position:absolute;left:50%;bottom:5cqw;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.9);border:.1cqw solid var(--acc);color:#fff;font:600 .95cqw/1.2 var(--ui);padding:.8cqw 1.4cqw;border-radius:2cqw;white-space:nowrap;animation:pop .2s ease-out}

/* bottom screen: shared */
.bottom-screen{container-type:inline-size;position:relative;aspect-ratio:1240/1080;overflow:hidden;overflow:clip;border-radius:.6cqw;background:#000;color:#f2f2f5;font-family:var(--ui)}
.bs{position:absolute;inset:0}
.bs-bg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.bs-status{position:absolute;top:3cqw;right:3cqw;z-index:3;display:flex;align-items:center;gap:1.4cqw;padding:1.1cqw 2.2cqw;border-radius:5cqw;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);font:700 2.3cqw/1 var(--ui);font-variant-numeric:tabular-nums}
.bs-status svg{width:2.6cqw;height:2.6cqw}
.bs-status .bat{color:var(--acc-hi)}
.bs-hints{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:flex-end;gap:3.2cqw;padding:2.6cqw 3.6cqw;font:700 2.4cqw/1 var(--ui);white-space:nowrap}
.g{display:inline-grid;place-items:center;width:4cqw;height:4cqw;border-radius:50%;font:800 2.1cqw/1 var(--display);color:#fff;background:#1a1a1e;border:.25cqw solid var(--acc);margin-right:1cqw;vertical-align:middle}
.bs-logo{font:400 7cqw/1.02 var(--logo);text-wrap:balance}
.bs-meta{font:600 2.6cqw/1.4 var(--ui);opacity:.8;margin-top:1.6cqw}
.bs-rows{margin:3cqw 0 0;display:grid;gap:0;font-size:2.7cqw}
.bs-rows div{display:flex;justify-content:space-between;gap:3cqw;padding:1.5cqw 0;border-bottom:1px solid rgba(255,255,255,.1)}
.bs-rows dt{opacity:.6}.bs-rows dd{margin:0;font-weight:700;text-align:right}
.bs-minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.6cqw;margin-top:3cqw}
.bs-minis .mini{aspect-ratio:1;border-radius:1cqw}

/* ═════════ Concept: Crimson Web ═════════ */
[data-style="crimson"]{--ui:"Rubik",var(--body);--logo:"Bungee",var(--display);--r:.9cqw;--gl:2.6cqw;--gt:2.6cqw;--gb:4.2cqw;--gap:1.1cqw}
[data-style="crimson"] .tile.focus::after{content:"";position:absolute;inset:-.55cqw;z-index:6;pointer-events:none;--k:var(--acc-hi);
  background:linear-gradient(var(--k),var(--k)) 0 0/1.6cqw .35cqw no-repeat,linear-gradient(var(--k),var(--k)) 0 0/.35cqw 1.6cqw no-repeat,
  linear-gradient(var(--k),var(--k)) 100% 0/1.6cqw .35cqw no-repeat,linear-gradient(var(--k),var(--k)) 100% 0/.35cqw 1.6cqw no-repeat,
  linear-gradient(var(--k),var(--k)) 0 100%/1.6cqw .35cqw no-repeat,linear-gradient(var(--k),var(--k)) 0 100%/.35cqw 1.6cqw no-repeat,

    c.fillStyle = A.acc+'26'; for(let i=0;i<180;i++) c.fillRect(r()*W, r()*H*.8, 1, H*(.03+r()*.1));

/* ───── Rules ───── */
function matchRule(rule){
  if(!rule) return LIB.slice();
  let list = LIB; if(rule.p) list = list.filter(g => rule.p.includes(g.p));
  switch(rule.kind){
    case 'fav': return list.filter(g => g.fav);
    case 'android': return list.filter(g => g.p==='AND');
    case 'emu': return list.filter(g => PLAT[g.p].emu===rule.value);
    case 'console': return list.filter(g => rule.value.includes(g.p));
    case 'genre': return list.filter(g => rule.value.includes(g.g));
    case 'unplayed': return list.filter(g => g.pt < 30);
    case 'random': { const r = rng('day'+new Date().toDateString()); const a = list.filter(g => g.p!=='AND'); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a.slice(0,rule.n||12); }
    case 'regex': { let re; try{ re = new RegExp(rule.value,'i'); }catch(e){ return []; } return list.filter(g => re.test(g.t)); }
    default: return list.slice();
  }
}
function ruleText(rule){
  if(!rule) return 'All games';
  switch(rule.kind){
    case 'fav': return 'Starred with X'; case 'android': return 'Installed Android games'; case 'emu': return 'Everything ' + rule.value + ' runs';
    case 'console': return rule.value.map(c => PLAT[c].n).join(', '); case 'genre': return rule.value.join(', ');
    case 'random': return (rule.n||12) + ' games, reshuffled daily'; case 'regex': return '/' + rule.value + '/i'; case 'unplayed': return 'Under 30 minutes played';
  }
  return 'All games';
}
const recentList = rule => matchRule(rule).filter(g => g.lastAt!=null).sort((a,b) => b.lastAt-a.lastAt);

const top = $('#top'), track = $('#track'), bottom = $('#bottom'), thor = $('#thor'), chrome = $('#chrome'), ov = $('#ov');
function miniHTML(g){ return `<div class="mini" style="--c1:${g.c1};--c2:${g.c2}" title="${esc(g.t)}"><img alt="" src="${sprFor(g)}"></div>`; }
function posterHTML(g,w,h,chip){

  return `<div class="poster ${shape}">${bg}<div class="pov"><div class="pchip">${esc(PLAT[g.p].n)}</div><div class="plogo">${esc(g.t)}</div></div>${chip?`<span class="chip">${chip}</span>`:''}</div>`;
}
function iconHTML(g){ return `<div class="ico"><div class="ico-in" style="--c1:${g.c1};--c2:${g.c2}"><img alt="" src="${sprFor(g)}"></div></div>`; }
function appHTML(t){

  return `<div class="clip"><div class="app${a.pat?' pat':''}" style="--ac:${a.c};--af:${a.f}">${appIcon(a)}<span class="app-n">${esc(a.n)}</span></div></div>`;
}
function folderHTML(t){

function weekData(rule){
  const share = rule ? .45 : 1, base = [85,40,0,150,95,210,62], out = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); out.push({k:DAYS[d.getDay()].slice(0,2), label:DAYS[d.getDay()], m:Math.round(base[6-i]*share)}); }
  return out;
}
function widgetHTML(t){
  const d = new Date();
  switch(t.kind){
    case 'clock': return `<div class="clip"><div class="clk"><div class="clk-t">${hm(d)}</div><div class="clk-d">${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</div></div></div>`;
    case 'music': {
      const s = musicState(t), tr = TRACKS[s.i];
      if(!s.playing && C.style==='crimson' && s.pos===41) return `<div class="clip"><div class="nomedia">${ICON.note}<span>No media playing</span></div></div>`;
      return `<div class="clip"><div class="mus"><div class="mus-art">${miniHTML(byId[tr.g])}</div><div class="mus-m"><div class="mus-l">${s.playing?'Now playing':'Paused'}</div><div class="mus-t">${esc(tr.t)}</div><div class="mus-a">${esc(tr.a)}</div><div class="mus-p"><i data-mp style="width:${(s.pos/tr.len*100).toFixed(1)}%"></i></div><div class="mus-ctl"><button data-mus="prev" aria-label="Previous track">${ICON.prev}</button><button class="play" data-mus="play" aria-label="${s.playing?'Pause':'Play'}">${s.playing?ICON.pause:ICON.play}</button><button data-mus="next" aria-label="Next track">${ICON.next}</button></div></div></div></div>`;
    }
    case 'playtime': {

      if(t.w===1) return `<div class="clip"><div class="ptw"><div class="ptw-n">${dur(total)}</div><div class="ptw-l">this week</div><div class="ptw-bars">${days.map((x,i) => `<i class="${i===6?'today':''}" style="height:${(x.m/max*100).toFixed(1)}%" title="${x.label}: ${dur(x.m)}"></i>`).join('')}</div></div></div>`;
      return `<div class="clip"><div class="ptw"><div class="ptw-n">${dur(total)}</div><div class="ptw-l">${t.filter?'on Android this week':'this week'}</div><div class="ptw-bars">${days.map((x,i) => `<i class="${i===6?'today':''}" style="height:${(x.m/max*100).toFixed(1)}%" title="${x.label}: ${dur(x.m)}"></i>`).join('')}</div><div class="ptw-days">${days.map((x,i) => `<span class="${i===6?'today':''}">${x.k}</span>`).join('')}</div></div></div>`;
    }

    case 'random': { const pick = state.roll[t.id] && byId[state.roll[t.id]]; if(pick) return `<div class="clip">${posterHTML(pick,t.w,t.h)}</div><span class="roll-chip">A to play</span>`; return `<div class="clip"><div class="rnd"><img alt="" src="${spriteURL('dice','#000','#ffffff',ACCENTS[state.accent].acc)}"><div class="rnd-l">Surprise me</div><div class="rnd-s">${LIB.length} games</div></div></div>`; }
    case 'lastImage': { const g = recentList(t.filter)[0]; return `<div class="clip">${posterHTML(g,t.w,t.h,'Continue')}</div>`; }
    case 'android': return t.app==='calendar' ? `<div class="clip"><div class="aw"><div class="aw-top"><span>Calendar</span>${ICON.cal}</div><div class="aw-big">${d.getDate()}</div><div class="aw-s">No events today</div></div></div>` : `<div class="clip"><div class="aw"><div class="aw-top"><span>Weather</span>${ICON.rain}</div><div class="aw-big">21°</div><div class="aw-s">Light rain · H 24° L 18°</div></div></div>`;
  }

}
function tileInner(t){
  if(t.type==='game'){ const g = byId[t.game]; if(C.style==='crimson' && t.w===1 && t.h===1) return iconHTML(g); return `<div class="clip">${posterHTML(g,t.w,t.h)}</div>`; }

  return widgetHTML(t);
}
function tileName(t){
  if(t.type==='game') return byId[t.game].t;
  if(t.type==='folder') return t.name;
  if(t.type==='art') return t.caption || ARTNAMES[t.art];
  if(t.type==='app') return APPS[t.app].n;
  if(t.kind==='android') return t.app==='calendar' ? 'Calendar' : 'Weather';
  return WIDGETS[t.kind];
}
function renderTile(t){
  const el = document.createElement('div');
  el.className = `tile t-${t.type}${t.kind?' k-'+t.kind:''}`; el.dataset.id = t.id;
  el.style.gridColumn = `${t.x+1} / span ${t.w}`; el.style.gridRow = `${t.y+1} / span ${t.h}`;
  el.setAttribute('role','button'); el.setAttribute('aria-label', tileName(t));
  el.innerHTML = tileInner(t); return el;
}
function renderAll(){
  track.innerHTML = '';
  pages.forEach((p,i) => { const pe = document.createElement('section'); pe.className = 'page'; pe.dataset.pi = i; const grid = document.createElement('div'); grid.className = 'grid'; p.tiles.forEach(t => grid.append(renderTile(t))); pe.append(grid); track.append(pe); });
  $('#wallimg').src = wallURL(); refresh();
}
function rerenderTile(t){ const old = track.querySelector(`[data-id="${t.id}"]`); if(!old) return; const n = renderTile(t); if(old.classList.contains('focus')) n.classList.add('focus'); old.replaceWith(n); }
function ensureFocus(){ const p = curPage(); if(!p.tiles.find(t => t.id===state.focus[state.page])){ const s = p.tiles.slice().sort((a,b) => a.y-b.y || a.x-b.x); state.focus[state.page] = s[0].id; } }
const focused = () => curPage().tiles.find(t => t.id===state.focus[state.page]);
function refresh(){
  track.style.transform = `translateX(${-state.page*100}%)`;
  top.querySelector('.wall').style.transform = `translateX(${-state.page/(pages.length-1)*13.04}%)`;
  ensureFocus(); applyFocus(); renderChrome(); renderOverlay(); renderBottom();
}
function applyFocus(){ track.querySelectorAll('.focus').forEach(e => e.classList.remove('focus')); const el = track.children[state.page].querySelector(`[data-id="${state.focus[state.page]}"]`); if(el) el.classList.add('focus'); }

/* ───── Chrome per concept ───── */
function renderChrome(){
  const d = new Date(), n = pages.length, i = state.page;
  if(C.style==='crimson'){
    chrome.innerHTML = `<div class="c-name"><b>${esc(curPage().name)}</b> · ${i+1}/${n}</div><div class="c-pager">${pages.map((p,k) => `<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
  } else if(C.style==='pinboard'){
    const dock = ['home','pad','folder','grid'];
    chrome.innerHTML = `<div class="pb-top"><span class="pb-tag">${esc(curPage().name)}</span><div class="pb-dots">${pages.map((p,k) => `<i class="${k===i?'on':''}"></i>`).join('')}</div><div class="pb-sys"><span data-now>${hm(d)}</span>|<span>72%</span>${ICON.bat.replace('<svg','<svg width="18" height="14"')}<span class="av">T</span></div></div>
      <button class="pb-arrow l" data-go="-1" aria-label="Previous page"${i===0?' hidden':''}>‹</button><button class="pb-arrow r" data-go="1" aria-label="Next page"${i===n-1?' hidden':''}>›</button>
      <div class="pb-bot"><div class="pb-h"><span><b>B</b>Back</span><span><b>Y</b>Details</span></div><div class="pb-dock">${pages.map((p,k) => `<button class="${k===i?'on':''}" data-page="${k}" aria-label="${esc(p.name)}">${ICON[dock[k]||'grid']}</button>`).join('')}</div><div class="pb-h r"><span><b>A</b>Select</span><span><b>≡</b>Menu</span></div></div>`;
  } else {
    chrome.innerHTML = `<div class="po-top"><div class="po-name">${esc(curPage().name)}</div><div class="po-ix">${two(i+1)} / ${two(n)}</div><div class="po-tabs">${pages.map((p,k) => `<button class="${k===i?'on':''}" data-page="${k}">${esc(p.name)}</button>`).join('')}</div><div class="po-time" data-now>${hm(d)}</div></div><div class="po-line"><i style="left:${i/n*100}%;width:${100/n}%"></i></div>`;
  }
}
let toastT;
function toast(msg){ state.toast = msg; renderOverlay(); clearTimeout(toastT); toastT = setTimeout(() => { state.toast = null; renderOverlay(); }, 1800); }
function renderOverlay(){
  ov.innerHTML = '';
  if(state.open){
    const o = state.open, el = document.createElement('div'); el.className = 'fview';
    el.innerHTML = `<div class="fv-h"><div><div class="fv-k">${esc(o.kind)}</div><div class="fv-t">${esc(o.title)}</div></div><code>${esc(o.rule)}</code><span class="n">${o.ids.length} games</span></div><div class="fv-g">${o.ids.map((id,k) => `<div class="fv-i${k===o.i?' focus':''}" data-fi="${k}">${posterHTML(byId[id],1,2)}</div>`).join('')}</div>`;
    ov.append(el);
    const f = el.querySelector('.fv-i.focus'), g = el.querySelector('.fv-g');
    if(f && g){ if(f.offsetTop < g.scrollTop) g.scrollTop = f.offsetTop - 10; else if(f.offsetTop+f.offsetHeight > g.scrollTop+g.clientHeight) g.scrollTop = f.offsetTop+f.offsetHeight-g.clientHeight+10; }
  }
  if(state.launch){
    const g = byId[state.launch.id], el = document.createElement('div'); el.className = 'launch';
    el.innerHTML = `<div><div class="l-cv">${posterHTML(g,1,2)}</div><div class="l-t">${esc(g.t)}</div><div class="l-s">${state.launch.phase==='play' ? `Running in ${esc(PLAT[g.p].emu)}. Press B to end this mock session.` : `Starting ${esc(PLAT[g.p].emu)}…`}</div>${state.launch.phase==='play'?'':'<div class="l-bar"><i></i></div>'}</div>`;
    ov.append(el);
  }
  if(state.toast){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = state.toast; ov.append(el); }
}

/* ───── Bottom screen ───── */
const H = (k,txt) => `<span><span class="g">${k}</span>${txt}</span>`;
function focusInfo(){
  if(state.launch){ const g = byId[state.launch.id]; return {g, title:g.t, kind:'Now playing', meta:`${PLAT[g.p].n} · ${PLAT[g.p].emu}`, hints:H('B','End session')}; }
  if(state.open){ const g = byId[state.open.ids[state.open.i]]; return g ? {g, title:g.t, kind:state.open.title, meta:`${PLAT[g.p].n} · ${g.y} · ${dur(g.pt)} played`, hints:H('A','Play')+H('X',g.fav?'Unstar':'Star')+H('B','Back')} : {title:state.open.title, kind:'Folder', meta:'Empty', hints:H('B','Back')}; }
  const t = focused();
  if(t.type==='game'){ const g = byId[t.game]; return {g, title:g.t, kind:PLAT[g.p].n, meta:`${PLAT[g.p].emu} · ${dur(g.pt)} played · ${ago(g)}`, hints:H('A','Play')+H('X',g.fav?'Unstar':'Star')+H('Y','Details')}; }
  if(t.type==='folder'){ const list = matchRule(t.rule); return {list, title:t.name, kind:'Folder · '+RULES[t.rule.kind], meta:`${list.length} games · ${ruleText(t.rule)}`, hints:H('A','Open')}; }
  if(t.type==='art') return {art:t, title:tileName(t), kind:'Image tile', meta:'Accent-tinted artwork. It sets the mood and does nothing when pressed.', hints:''};
  if(t.type==='app') return {app:APPS[t.app], title:APPS[t.app].n, kind:'Android app', meta:'Opens the app.', hints:H('A','Open')};
  if(t.kind==='lastImage'){ const g = recentList(t.filter)[0]; return {g, title:g.t, kind:'Continue', meta:`${PLAT[g.p].n} · ${PLAT[g.p].emu} · ${ago(g)}`, hints:H('A','Resume')}; }
  if(t.kind==='random' && state.roll[t.id]){ const g = byId[state.roll[t.id]]; return {g, title:g.t, kind:'Rolled', meta:`${PLAT[g.p].n} · ${dur(g.pt)} played`, hints:H('A','Play')+H('B','Clear')}; }
  if(t.kind==='music'){ const s = musicState(t), tr = TRACKS[s.i]; return {g:byId[tr.g], title:tr.t, kind:s.playing?'Now playing':'Music', meta:tr.a, hints:H('A',s.playing?'Pause':'Play')}; }
  const hint = {random:H('A','Roll'), recent:H('A','History')}[t.kind] || '';
  return {title:tileName(t), kind:t.kind==='android'?'Android widget':'Widget', meta:WDESC[t.kind], hints:hint};
}
function detailRows(info){
  const g = info.g; if(!g) return '';
  return `<dl class="bs-rows"><div><dt>Platform</dt><dd>${esc(PLAT[g.p].n)} · ${g.y}</dd></div><div><dt>Opens in</dt><dd>${esc(PLAT[g.p].emu)}</dd></div><div><dt>Played</dt><dd>${dur(g.pt)}</dd></div><div><dt>Last played</dt><dd>${ago(g)}</dd></div><div><dt>Favourite</dt><dd>${g.fav?'★ Yes':'No'}</dd></div></dl>`;
}
function statusPill(){ return `<div class="bs-status">${ICON.wifi}<span class="bat">${ICON.bat}</span><span>91%</span><span data-now>${hm(new Date())}</span></div>`; }
function renderBottom(){
  const info = focusInfo(), A = ACCENTS[state.accent];
  let html = '';
  const extra = state.details && info.g ? detailRows(info) : info.list ? `<div class="bs-minis">${info.list.slice(0,6).map(miniHTML).join('')}</div>` : '';
  if(C.style==='crimson'){
    html = `<img class="bs-bg" alt="" src="${artURL('web',620,540,'bottom')}">${statusPill()}<div class="bs-text"><div class="bs-logo">${esc(info.title)}</div><div class="bs-meta">${esc(info.kind)} · ${esc(info.meta)}</div>${extra}</div>`;
  } else if(C.style==='pinboard'){
    const art = info.g ? (info.g.scene ? `<img class="bs-bg scene" alt="" src="${sceneURL(info.g.scene,124,108,info.g.id)}">` : posterHTML(info.g,2,2)) : info.art ? `<img class="bs-bg" alt="" src="${artURL(info.art.art,620,540,info.art.id)}">` : info.app ? `<div class="app${info.app.pat?' pat':''}" style="--ac:${info.app.c};--af:${info.app.f}">${appIcon(info.app)}</div>` : `<img class="bs-bg" alt="" src="${artURL('moon',620,540,'pb')}">`;
    html = `<div class="bs-art">${art}</div><div class="bs-shade"></div>${statusPill()}<div class="bs-text"><span class="bs-tag">${esc(info.kind)}</span><div class="bs-logo">${esc(info.title)}</div><div class="bs-meta">${esc(info.meta)}</div>${extra}</div>`;
  } else {
    const cv = info.g ? posterHTML(info.g,1,2) : info.art ? `<img class="art" alt="" src="${artURL(info.art.art,300,400,info.art.id)}">` : info.list && info.list[0] ? posterHTML(info.list[0],1,2) : `<img class="art" alt="" src="${artURL('blossom',300,400,'po')}">`;
    html = `<div class="bs-glow"></div><div class="bs-cv">${cv}</div><div class="bs-side"><div class="bs-k">${esc(info.kind)}</div><div class="bs-logo">${esc(info.title)}</div><div class="bs-meta">${esc(info.meta)}</div>${extra}</div>`;
  }
  bottom.innerHTML = `<div class="bs">${html}<div class="bs-hints">${info.hints}${info.g&&!state.launch&&!state.open?'':''}</div></div>`;
}

/* ───── Actions ───── */
function goPage(np, from, dir){
  if(np<0 || np>=pages.length || np===state.page) return;
  state.page = np;
  if(from && dir){ const its = curPage().tiles, row = from.y + from.h/2; const onRow = its.filter(i => i.y <= row && row < i.y+i.h); const pool = (onRow.length ? onRow : its).slice(); pool.sort((a,b) => dir==='right' ? a.x-b.x : (b.x+b.w)-(a.x+a.w)); state.focus[np] = pool[0].id; }
  refresh();
}
const rangeGap = (a,al,b,bl) => Math.max(0, Math.max(a,b) - Math.min(a+al,b+bl));
function move(dir){
  const its = curPage().tiles, cur = focused(); let best = null, bs = Infinity;
  for(const it of its){
    if(it===cur) continue; let gap, perp;
    if(dir==='right'){ if(it.x < cur.x+cur.w) continue; gap = it.x-(cur.x+cur.w); perp = rangeGap(it.y,it.h,cur.y,cur.h); }
    else if(dir==='left'){ if(it.x+it.w > cur.x) continue; gap = cur.x-(it.x+it.w); perp = rangeGap(it.y,it.h,cur.y,cur.h); }
    else if(dir==='down'){ if(it.y < cur.y+cur.h) continue; gap = it.y-(cur.y+cur.h); perp = rangeGap(it.x,it.w,cur.x,cur.w); }
    else { if(it.y+it.h > cur.y) continue; gap = cur.y-(it.y+it.h); perp = rangeGap(it.x,it.w,cur.x,cur.w); }
    const cd = Math.abs((it.x+it.w/2)-(cur.x+cur.w/2)) + Math.abs((it.y+it.h/2)-(cur.y+cur.h/2));
    const s = gap*10 + perp*25 + cd; if(s < bs){ bs = s; best = it; }
  }
  if(best){ setFocus(best.id); return; }
  if(dir==='left' || dir==='right') goPage(state.page + (dir==='right'?1:-1), cur, dir);
}
function setFocus(id){ state.focus[state.page] = id; applyFocus(); renderBottom(); }
let launchT, rollT;
function launch(g){ state.launch = {id:g.id, t0:Date.now(), phase:'boot'}; renderOverlay(); renderBottom(); clearTimeout(launchT); launchT = setTimeout(() => { if(state.launch){ state.launch.phase = 'play'; renderOverlay(); } }, 1700); }
function endLaunch(){ const g = byId[state.launch.id]; g.lastAt = Date.now(); g.pt += 1; played[g.id] = [g.lastAt, g.pt]; state.launch = null; saveLib(); renderAll(); toast(`${g.t} is now your last played`); }
function openList(title, kind, rule, list){ state.open = {title, kind, rule, ids:list.map(g => g.id), i:0}; renderOverlay(); renderBottom(); }
function roll(t){
  clearInterval(rollT); let n = 0;
  rollT = setInterval(() => {
    const g = LIB[Math.floor(Math.random()*LIB.length)], el = track.querySelector(`[data-id="${t.id}"]`);
    if(++n >= 14){ clearInterval(rollT); state.roll[t.id] = g.id; rerenderTile(t); renderBottom(); return; }
    if(el) el.innerHTML = `<div class="clip">${posterHTML(g,t.w,t.h)}</div>`;
  }, 65);
}
function musicCtl(t,a){ const s = musicState(t); if(a==='play') s.playing = !s.playing; if(a==='next'){ s.i = (s.i+1)%TRACKS.length; s.pos = 0; } if(a==='prev'){ s.i = (s.i-1+TRACKS.length)%TRACKS.length; s.pos = 0; } if(s.pos===41) s.pos = 42; rerenderTile(t); renderBottom(); }
function toggleFav(g){ g.fav = !g.fav; saveLib(); const keep = state.open; renderAll(); state.open = keep; renderOverlay(); renderBottom(); toast(g.fav ? `Starred ${g.t}` : `Unstarred ${g.t}`); }
function activate(){
  const t = focused();
  if(t.type==='game') return launch(byId[t.game]);
  if(t.type==='folder') return openList(t.name, 'Folder · '+RULES[t.rule.kind], ruleText(t.rule), matchRule(t.rule));
  if(t.type==='app') return toast(`Opens ${APPS[t.app].n}`);
  if(t.type==='art') return toast('Image tiles are decoration');
  switch(t.kind){
    case 'lastImage': return launch(recentList(t.filter)[0]);
    case 'random': return state.roll[t.id] ? launch(byId[state.roll[t.id]]) : roll(t);
    case 'music': return musicCtl(t,'play');
    case 'recent': return openList('Recently played','History','Newest first',recentList(t.filter));
    case 'clock': return toast('Opens Android Clock');
    case 'android': return toast('Opens the app behind this widget');
    case 'playtime': return toast('Opens playtime history');
  }
}
function press(btn){
  if(state.launch){ if(btn==='B' && state.launch.phase==='play') endLaunch(); return; }
  if(state.open){
    const o = state.open, n = o.ids.length;
    if(btn==='B'){ state.open = null; renderOverlay(); renderBottom(); return; }
    if(btn==='A' && n) return launch(byId[o.ids[o.i]]);
    if(btn==='X' && n) return toggleFav(byId[o.ids[o.i]]);
    if(btn==='Y'){ state.details = !state.details; renderBottom(); return; }
    const step = {left:-1,right:1,up:-7,down:7}[btn];
    if(step && n){ o.i = Math.min(n-1, Math.max(0, o.i+step)); renderOverlay(); renderBottom(); }
    return;
  }
  switch(btn){
    case 'up': case 'down': case 'left': case 'right': return move(btn);
    case 'A': return activate();
    case 'B': { const t = focused(); if(state.roll[t.id]){ delete state.roll[t.id]; rerenderTile(t); renderBottom(); return; } if(state.page!==0) goPage(0); return; }
    case 'X': { const t = focused(); if(t.type==='game') toggleFav(byId[t.game]); return; }
    case 'Y': state.details = !state.details; renderBottom(); toast(state.details ? 'Bottom screen: details' : 'Bottom screen: showcase'); return;
    case 'L': return goPage(state.page-1);
    case 'R': return goPage(state.page+1);
  }
}

/* ───── Input ───── */
top.addEventListener('click', e => {
  const mb = e.target.closest('[data-mus]');
  if(mb){ e.stopPropagation(); const t = curPage().tiles.find(x => x.id===mb.closest('[data-id]').dataset.id); if(t){ setFocus(t.id); musicCtl(t, mb.dataset.mus); } return; }
  const pg = e.target.closest('[data-page]'); if(pg){ goPage(+pg.dataset.page); return; }
  const go = e.target.closest('[data-go]'); if(go){ goPage(state.page + (+go.dataset.go)); return; }
  if(e.target.closest('.launch')){ press('B'); return; }
  const fi = e.target.closest('[data-fi]');
  if(fi && state.open){ const k = +fi.dataset.fi; if(state.open.i===k) press('A'); else { state.open.i = k; renderOverlay(); renderBottom(); } return; }
  const tl = e.target.closest('.grid [data-id]');
  if(tl && !state.open){ if(+tl.closest('.page').dataset.pi !== state.page) return; if(state.focus[state.page]===tl.dataset.id) press('A'); else setFocus(tl.dataset.id); }
});
document.querySelectorAll('[data-btn]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); thor.focus({preventScroll:true}); press(b.dataset.btn); }));
thor.addEventListener('pointerdown', () => setTimeout(() => thor.focus({preventScroll:true}), 0));
const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'A',a:'A',Escape:'B',Backspace:'B',b:'B',x:'X',y:'Y',q:'L','[':'L',e:'R',']':'R'};
thor.addEventListener('keydown', e => { const b = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()]; if(!b) return; e.preventDefault(); press(b); });
const idle = 'Click the device, then use the keyboard. Tiles respond to clicks too: click once to select, again to open.';
thor.addEventListener('focus', () => { $('#kbhint').innerHTML = '<b>Keyboard is live.</b> Arrows move, Enter opens, Esc goes back, X stars, Y flips the bottom screen to details, Q and E change pages.'; });
thor.addEventListener('blur', () => { $('#kbhint').textContent = idle; });
const GP = {0:'A',1:'B',2:'X',3:'Y',4:'L',5:'R',12:'up',13:'down',14:'left',15:'right'};
let gpPrev = {}, gpRun = false, axT = 0;
function gpLoop(){
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; if(!pads.length){ gpRun = false; return; }
  const gp = pads[0]; Object.entries(GP).forEach(([i,b]) => { const on = gp.buttons[i] && gp.buttons[i].pressed; if(on && !gpPrev[i]) press(b); gpPrev[i] = on; });
  const [ax,ay] = gp.axes, now = performance.now(); if(now > axT && (Math.abs(ax)>.6 || Math.abs(ay)>.6)){ press(Math.abs(ax)>Math.abs(ay) ? (ax>0?'right':'left') : (ay>0?'down':'up')); axT = now + 220; }
  requestAnimationFrame(gpLoop);
}
window.addEventListener('gamepadconnected', () => { if(!gpRun){ gpRun = true; gpLoop(); } });

/* ───── Accent ───── */
function applyAccent(){
  const A = ACCENTS[state.accent], root = document.documentElement.style;
  root.setProperty('--acc', A.acc); root.setProperty('--acc-hi', A.hi); root.setProperty('--acc-lo', A.lo);
  document.querySelectorAll('#swatches button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.acc===state.accent)));
}
$('#swatches').innerHTML = Object.entries(ACCENTS).map(([k,a]) => `<button data-acc="${k}" aria-pressed="false"><i style="background:${a.acc};color:${a.acc}"></i>${a.n}</button>`).join('');
$('#swatches').addEventListener('click', e => { const b = e.target.closest('[data-acc]'); if(!b) return; state.accent = b.dataset.acc; try{ localStorage.setItem(LS+'-accent', state.accent); }catch(err){} applyAccent(); renderAll(); });

/* ───── Ticking ───── */
let lastMin = new Date().getMinutes();
setInterval(() => {
  const d = new Date();
  document.querySelectorAll('[data-now]').forEach(el => el.textContent = hm(d));
  if(d.getMinutes()!==lastMin){ lastMin = d.getMinutes(); pages.forEach(p => p.tiles.filter(t => t.kind==='clock').forEach(rerenderTile)); }
  pages.forEach(p => p.tiles.filter(t => t.kind==='music').forEach(t => {
    const s = musicState(t); if(!s.playing) return; s.pos++;
    if(s.pos >= TRACKS[s.i].len){ s.pos = 1; s.i = (s.i+1)%TRACKS.length; rerenderTile(t); return; }
    const bar = track.querySelector(`[data-id="${t.id}"] [data-mp]`); if(bar) bar.style.width = (s.pos/TRACKS[s.i].len*100).toFixed(1)+'%';
  }));
}, 1000);

/* ───── Page text ───── */
thor.setAttribute('data-style', C.style); thor.setAttribute('aria-label', `${C.name} launcher on a black AYN Thor. Click, then use arrow keys, Enter, Escape, X, Y, Q and E.`);
$('#eyebrow').textContent = C.eyebrow; $('#h1').innerHTML = C.title; $('#blurb').textContent = C.blurb; $('#kbhint').textContent = idle;
$('#notes').innerHTML = C.notes.map(([a,b]) => `<div><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('');
applyAccent(); renderAll();
})();
</script>
